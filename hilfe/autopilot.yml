name: Instagram Autopilot

# Läuft jede Stunde und postet, sobald laut einstellungen.yml etwas dran ist.
# Von Hand: Actions → Instagram Autopilot → Run workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        default: setup-pruefen
        options: [setup-pruefen, vorschau, stimmproben, bildstile, kit-update, jetzt-posten, jetzt-story-posten, token-erneuern, automatisch]

permissions:
  contents: write

concurrency: autopilot

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Kit auspacken (nur beim ersten Lauf)
        run: |
          zip="$(ls *.zip 2>/dev/null | head -1)"
          if [ -n "$zip" ] && [ ! -d autopilot ]; then
            unzip -q "$zip" -d /tmp/kit
            quelle="$(dirname "$(find /tmp/kit -name einstellungen.yml | head -1)")"
            tar -C "$quelle" --exclude=./.github -cf - . | tar -xf -
            git rm -q "$zip"
            git config user.name autopilot && git config user.email autopilot@users.noreply.github.com
            git add -A && git commit -qm "Insta-Autopilot ausgepackt" && git push -q
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Autopilot
        run: python -m autopilot lauf --aktion "${{ github.event.inputs.aktion || 'automatisch' }}"

      - name: Vorschau zum Herunterladen
        if: github.event.inputs.aktion == 'vorschau' || github.event.inputs.aktion == 'stimmproben' || github.event.inputs.aktion == 'bildstile'
        uses: actions/upload-artifact@v6
        with:
          name: vorschau
          path: ausgabe/*.*
          retention-days: 7
